{% extends 'base.html' %}
{% load static persian_tags %}
{% block title %}پروفایل من{% endblock %}
{% block content %}
<div class="page-head">
  <div><h1>پروفایل من</h1><p class="sub">هویت، تماس و امضای الکترونیک</p></div>
  <a href="{% url 'secretariat:kartable' %}" class="btn">بازگشت</a>
</div>

<form method="post" enctype="multipart/form-data" class="card form">{% csrf_token %}
  <div class="grid-2">
    <div>
      <label for="first_name">نام</label>
      <input id="first_name" name="first_name" class="input" value="{{ user.first_name }}" maxlength="150">
    </div>
    <div>
      <label for="last_name">نام خانوادگی</label>
      <input id="last_name" name="last_name" class="input" value="{{ user.last_name }}" maxlength="150">
    </div>
  </div>
  <div class="grid-2">
    <div>
      <label for="email">رایانامه</label>
      <input id="email" name="email" class="input" value="{{ user.email }}" dir="ltr">
    </div>
    <div>
      <label for="phone">شماره تماس</label>
      <input id="phone" name="phone" class="input num" value="{{ profile.phone }}" dir="ltr" style="text-align:right">
    </div>
  </div>
  <div>
    <label for="signature">امضای الکترونیک (تصویر)</label>
    <input id="signature" name="signature" type="file" accept="image/*" class="input">
    {% if profile.signature %}
    <p class="sub">امضای فعلی ثبت است — با انتخاب فایل تازه، جایگزین می‌شود.</p>
    {% endif %}
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" type="submit">ذخیره</button>
  </div>
</form>
{% endblock %}
