{% for f in form %}
<div class="field {% if f.name == 'summary' or f.name == 'body' or f.name == 'note' or f.name == 'attachments' %}full{% endif %}">
  <label for="{{ f.id_for_label }}">{{ f.label }}{% if f.field.required %} <span class="req">*</span>{% endif %}</label>
  {{ f }}
  {% if f.help_text %}<div class="help">{{ f.help_text }}</div>{% endif %}
  {% for e in f.errors %}<div class="err">{{ e }}</div>{% endfor %}
</div>
{% endfor %}
