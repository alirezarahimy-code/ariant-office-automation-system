<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><title>{{ title }}</title></head>
<body style="margin:0;padding:0;background:#f7f8fa;font-family:Vazirmatn,Tahoma,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7f8fa;padding:24px 0;">
    <tr><td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0"
             style="background:#ffffff;border:1px solid #e4e7ee;border-top:3px solid #16365f;border-radius:10px;overflow:hidden;">
        <tr>
          <td style="background:#16365f;color:#ffffff;padding:16px 22px;font-size:14px;font-weight:700;">
            {{ site_name }}
          </td>
        </tr>
        <tr>
          <td style="padding:24px 22px;">
            <p style="margin:0 0 8px;font-size:12px;color:#8b98ab;">
              {% if user.first_name %}{{ user.first_name }} {{ user.last_name }} عزیز،{% else %}کاربر گرامی،{% endif %}
            </p>
            <h1 style="margin:0 0 12px;font-size:17px;color:#1a2333;">{{ title }}</h1>
            {% if body %}
            <p style="margin:0 0 18px;font-size:14px;line-height:2;color:#5c6b80;white-space:pre-wrap;">{{ body }}</p>
            {% endif %}
            {% if url %}
            <a href="{{ url }}"
               style="display:inline-block;background:#0e8f7e;color:#ffffff;text-decoration:none;font-size:13px;font-weight:700;padding:10px 22px;border-radius:8px;">
              مشاهده در سامانه
            </a>
            {% endif %}
          </td>
        </tr>
        <tr>
          <td style="padding:14px 22px;border-top:1px solid #e4e7ee;font-size:11px;color:#8b98ab;">
            این پیام به‌صورت خودکار از {{ site_name }} ارسال شده است؛ لطفاً به آن پاسخ ندهید.
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
