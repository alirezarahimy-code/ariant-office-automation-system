<script>
const seed={view:'dashboard',absentRows:[],settings:{attendancePath:'',attendancePassword:'',attendanceTable:'',pollSeconds:5,uidColumn:'L_UID',cardColumn:'C_Card',dateColumn:'C_Date',timeColumn:'C_Time',cutSourceRows:true},printer:{host:'',port:'9100',encoding:'CP864',name:'چاپگر شبکه‌ای',template:'Classic',company:'نام سازمان',title:'فیش غذای پرسنل',footer:'نوش جان',paper:'80mm'},guests:{cards:[],cooldown:3,maxDaily:20,food:'مهمان'},employees:[],orders:[],events:[]};
 const storage={get(){try{return window.localStorage.getItem('food-ticket-web')}catch{return null}},set(v){try{window.localStorage.setItem('food-ticket-web',v)}catch{}} ,remove(){try{window.localStorage.removeItem('food-ticket-web')}catch{}}};
 const dbBoot={token:String(window.FOOD_TICKET_DB_TOKEN||''),fresh:window.FOOD_TICKET_DB_FRESH===true||window.FOOD_TICKET_DB_FRESH==='1'};
const blankState=()=>JSON.parse(JSON.stringify(seed));
/* ۱.۳۵ — دورریزِ «داده» با حفظِ «تنظیمات»: با خام‌شدن یا تعویض دیتابیس فقط داده‌ها (کارمندان،
   سفارش‌ها، رویدادها، کارت‌های مهمان) پاک می‌شوند؛ تنظیمات اتصال به سامانه و چاپگر دست‌نخورده می‌مانند
   تا با یک کشِ خالی، پیکربندی سالمِ سامانه از بین نرود. */
function purgeData(saved){const blank=blankState();try{const s=(saved&&typeof saved==='object')?saved:{};if(s.settings&&typeof s.settings==='object')blank.settings={...blank.settings,...s.settings};if(s.printer&&typeof s.printer==='object')blank.printer={...blank.printer,...s.printer};if(s.guests&&typeof s.guests==='object')blank.guests={...blank.guests,cooldown:(s.guests.cooldown??blank.guests.cooldown),maxDaily:(s.guests.maxDaily??blank.guests.maxDaily),food:(s.guests.food??blank.guests.food),cards:[]};if(typeof s.view==='string'&&s.view)blank.view=s.view;if(dbBoot.token!=='')blank.__dbToken=dbBoot.token;else if(s.__dbToken)blank.__dbToken=s.__dbToken}catch{}return blank}
/* پاک‌کردن کش مرورگر (فقط داده‌ها) و بازگرداندن وضعیت به حالت خالی */
function resetLocalState(){try{try{storage.remove()}catch{}const keep=purgeData(state);Object.keys(state).forEach(k=>{delete state[k]});Object.assign(state,keep)}catch{}state.events=[];state.reportEvents=[];state.monitoringLoaded=false;try{persist()}catch{}return true}
/* بررسی هویت دیتابیس: خام بودن یا تعویض نصب ⇒ کش مرورگر دور ریخته می‌شود */
function applyDbIdentity(db){if(!db||typeof db!=='object')return false;const token=String(db.token||'');const fresh=db.fresh===true||db.fresh==='1';const known=String(state.__dbToken||'');if(fresh||(token!==''&&known!==''&&token!==known)){resetLocalState();if(token!=='')dbBoot.token=token;dbBoot.fresh=fresh;return true}if(token!=='')dbBoot.token=token;return false}
let state=(()=>{try{const saved=JSON.parse(storage.get()||'null');if(!saved)return blankState();
/* ۱.۳۴ — جداسازی دیتابیس خام: اگر دیتابیس سامانه خام/تازه نصب شده یا کش مرورگر به نصب دیگری
   تعلق دارد، دادهٔ ذخیره‌شده در مرورگر نمایش داده نمی‌شود و کامل دور ریخته می‌شود. */
const savedToken=String(saved.__dbToken||'');
if(dbBoot.fresh===true)return purgeData(saved);
if(dbBoot.token!==''&&savedToken!==''&&savedToken!==dbBoot.token)return purgeData(saved);const demoEmp=Array.isArray(saved.employees)&&saved.employees.some(e=>e&&(e.pc==='1001'||e.pc==='1002'||e.pc==='1003'));const demoOrd=Array.isArray(saved.orders)&&saved.orders.some(o=>o&&(o.food==='چلوکباب'||o.food==='قورمه‌سبزی'));const demoGuest=saved.guests&&(String(saved.guests.cards||'').includes('888225E3')||String(saved.guests.cards||'').includes('A5659EE4'));if(demoEmp||demoOrd||demoGuest)return purgeData(saved);return saved}catch{return blankState()}})();if(state.healthState&&typeof state.healthState==='object'){state.healthState={status:'',checks:[]}}state.events=[];state.orders=[];state.reportOrders=[];state.reportEvents=[];state.monitoringLoaded=false;let view=state.view||'dashboard';

 const EMPTY_HEALTH_PROBE_INTERVAL_MS=20000;
 let healthProbeTimer=null;
 function healthStatusLabel(ok,value){return ok?`<span class="status ok">${esc(value)}</span>`:`<span class="status bad">${esc(value)}</span>`}
 function renderHealthPayload(payload){
   const database=payload.database||{},access=payload.access||{},printer=payload.printer||{},queue=payload.queue||{};
   const engineOn=Boolean(payload.php_worker);
   const engineLabel=payload.php_worker?'سرویس PHP Worker (موتور پایش)':'موتور پایش';
   const records=Number(database.records||0);
   const rows=[
     [engineLabel,engineOn?'فعال':'غیرفعال',engineOn],
     ['دیتابیس داخلی مانیتورینگ',database.writable?`آماده (${records} رکورد)`:'غیرقابل نوشتن',Boolean(database.writable)],
     ['تردد',access.configured?'تنظیم‌شده':'در انتظار مسیر',Boolean(access.configured)],
          ['چاپگر',printer.ready?`${printer.mode==='socket'?'TCP/RAW':'صف Windows'}: ${printer.host||printer.name||'-'}`:'در انتظار تنظیم',Boolean(printer.ready)],
     ['کلید SSO',payload.sso?'معتبر':'نامعتبر',Boolean(payload.sso)],
     ['صف چاپ',`در انتظار: ${queue.pending||0} | خطا: ${queue.print_error||0}`,!queue.print_error],
     ['آخرین رویداد',queue.last_event_at||(records===0?'هنوز رویدادی پردازش نشده — دکمه پردازش الآن را بزنید':'—'),Boolean(queue.last_event_at)||records===0]

function normHm(v){const s=String(v==null?'':v).trim().replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d));const m=s.match(/^(\d{1,2}):(\d{2})$/);if(!m)return null;const h=Number(m[1]),mi=Number(m[2]);if(h>23||mi>59)return null;return String(h).padStart(2,'0')+':'+m[2]}

function normalizeDigits(value){return String(value??'').replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d))).replace(/[٠-٩]/g,d=>String('٠١٢٣٤٥٦٧٨٩'.indexOf(d)))}
function jalaliToGregorian(jy,jm,jd){let gy=jy<=979?621:1600;let y=jy<=979?jy:jy-979;let days=365*y+Math.floor(y/33)*8+Math.floor((y%33+3)/4)+78+jd+(jm<7?(jm-1)*31:(jm-7)*30+186);gy+=400*Math.floor(days/146097);days%=146097;if(days>36524){gy+=100*Math.floor(--days/36524);days%=36524;if(days>=365)days++}gy+=4*Math.floor(days/1461);days%=1461;if(days>365){gy+=Math.floor((days-1)/365);days=(days-1)%365}let gd=days+1;const leap=gy%4===0&&gy%100!==0||gy%400===0,md=[31,leap?29:28,31,30,31,30,31,31,30,31,30,31];let gm=0;while(gd>md[gm])gd-=md[gm++];return `${gy}-${String(gm+1).padStart(2,'0')}-${String(gd).padStart(2,'0')}`}
function isoDateFor(value){const raw=normalizeDigits(value).trim();if(!raw)return '';if(/^\d{4}-\d{2}-\d{2}$/.test(raw))return raw;const digits=raw.replace(/\D/g,'');if(digits.length!==8)return raw.slice(0,10);const year=Number(digits.slice(0,4));return year<1700?jalaliToGregorian(year,Number(digits.slice(4,6)),Number(digits.slice(6,8))):`${digits.slice(0,4)}-${digits.slice(4,6)}-${digits.slice(6,8)}`}
function todayJalali(){return new Intl.DateTimeFormat('en-US-u-ca-persian',{year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()).replace(/[^0-9/]/g,'').replace(/(\d{2})\/(\d{2})\/(\d{4})/,'$3/$1/$2')}
function timeLabel(value){const digits=normalizeDigits(value).replace(/\D/g,'');return digits.length===6?`${digits.slice(0,2)}:${digits.slice(2,4)}:${digits.slice(4,6)}`:value||'—'}
function guestList(){const raw=state.guests.cards;const toCard=function(c){if(c==null)return null;if(typeof c==='string'){const n=c.trim();return n?{id:0,cardNumber:n,name:'مهمان',active:true}:null}var cn=(c.cardNumber||c.card_uid||'');if(typeof cn!=='string')cn=String(cn||'');cn=cn.trim();if(!cn&&typeof c.id==='string')cn=String(c.id).trim();if(!cn)return null;var dbId=0;if(typeof c.recordId==='number')dbId=c.recordId;else if(typeof c.id==='number')dbId=c.id;return{id:dbId||0,cardNumber:cn,name:c.name||'مهمان',active:c.active!==false&&c.active!==0&&c.active!=='0'};};if(Array.isArray(raw))return raw.map(toCard).filter(Boolean);return String(raw||'').split(/[,،]/).map(function(s){return s.trim()}).filter(Boolean).map(function(n){return{id:0,cardNumber:n,name:'مهمان',active:true}})}


function guestCardForm(){const cards=guestList();const g=state.guests;return `<section>${heading('ثبت شماره کارت مهمان','ثبت، فعال‌سازی و حذف کارت‌های RFID مهمان','<button class="btn primary" data-action="save-guests">ذخیره تنظیمات مهمان</button>')}<div class="layout"><div><div class="card"><form class="form-grid" id="guest-card-form"><input type="hidden" name="recordId" value=""><label class="field">شماره کارت / C_Card<input name="cardNumber" required placeholder="مثلاً 888225E3"></label><label class="field"><span class="switch"><input name="active" type="checkbox" checked> کارت فعال باشد</span></label><div class="form-actions"><button class="btn primary">ثبت کارت مهمان</button></div></form></div><div class="card section-gap table-wrap"><table class="table"><thead><tr><th>ردیف</th><th>شماره کارت</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody>${cards.map((c,i)=>`<tr><td>${i+1}</td><td>${esc(c.cardNumber)}</td><td><span class="status ${c.active?'ok':'bad'}">${c.active?'فعال':'غیرفعال'}</span></td><td><button class="btn ghost" data-action="edit-guest-card" data-index="${i}">ویرایش</button> <button class="btn danger" data-action="delete-guest-card" data-index="${i}" data-id="${c.id||0}">حذف</button></td></tr>`).join('')||`<tr><td colspan="4" class="empty">هنوز کارتی ثبت نشده است.</td></tr>`}</tbody></table></div></div><div class="card"><h3>تنظیمات پردازش مهمان</h3><label class="field">فاصلهٔ بین دو فیش (ثانیه)<input id="guest-cool" type="number" min="1" value="${g.cooldown}"></label><label class="field" style="margin-top:12px">سقف ثابت فیش مهمان در روز (در حالت متغیر فقط پشتیبان خطای شمارش تردد)<input id="guest-max" type="number" min="0" value="${g.maxDaily}"></label>${capModeControl(g)}<label class="field" style="margin-top:12px">نوع غذای مهمان<input id="guest-food" value="${esc(g.food)}"></label><p class="notice warn" style="margin-top:15px">کارت مهمان هم مانند کارت پرسنل در مانیتورینگ ثبت می‌شود و بعد از ثبت پردازش از SOURCE_TABLE حذف خواهد شد.</p></div></div></section>`}
function printerForm(){setTimeout(()=>{const ab=document.querySelector('[data-action="load-align"]');if(ab)ab.click()},60);const p=state.printer||{};const printers=state.printers||[];const installed=state.printersInstalled||printers;const hint=state.printersHint||'';const selected=p.name||'';const mode=(p.mode==='socket'||p.mode==='windows-spooler')?p.mode:((p.mode_db==='windows_share')?'windows-spooler':((p.mode_db==='tcp_raw')?'socket':(p.host?'socket':(selected?'windows-spooler':'socket'))));const expected=window.__ftPanelExpected||'';return `<section>${heading('تنظیمات چاپگر فیش','چاپ مستقیم روی چاپگر شبکه (IP و پورت 9100) یا از طریق صف چاپگر Windows','<button class="btn ghost" data-action="refresh-printers">↻ بروزرسانی لیست چاپگرها</button><button class="btn ghost" data-action="print-diag">وضعیت واقعی روی سرور</button><button class="btn ghost" data-action="calibrate-print">کارت کالیبراسیون</button><button class="btn primary" data-action="test-print">چاپ آزمایشی</button>')}<div class="printer-hero"><h3>روش فعلی: ${mode==='socket'?'چاپگر شبکه (TCP/RAW)':'صف چاپگر Windows'}</h3><p style="margin:0;color:#334155">${mode==='socket'?'فیش مستقیم به IP چاپگر ارسال می‌شود و نیازی به نصب درایور روی سرور نیست.':'درایور چاپگر باید روی سرور Windows نصب باشد؛ Worker از همین چاپگر استفاده می‌کند.'}</p><div class="printer-grid-status"><div class="box"><b>${installed.length}</b><span>چاپگر نصب‌شده</span></div><div class="box"><b>${selected? '✓' : '—'}</b><span>انتخاب فعلی</span></div><div class="box"><b>${mode==='socket'?'TCP':'Win'}</b><span>روش چاپ</span></div></div>${hint?`<p class="muted">${esc(hint)}</p>`:''}</div><div class="layout"><div class="card"><form class="form-grid" id="printer-form"><label class="field full">روش چاپ<select name="mode"><option value="socket" ${mode==='socket'?'selected':''}>چاپگر شبکه — TCP/RAW با IP</option><option value="windows-spooler" ${mode!=='socket'?'selected':''}>صف چاپگر Windows</option></select></label><label class="field full win-only" رسی درست چاپ شود؛ افزونهٔ GD در PHP باید فعال باشد.':'اگر لیست خالی است، Worker و PHP باید روی همان سرور Windows اجرا شوند.'}</p></div></div></section>`}

function loadGuestOrdersReport(){if(!serviceMode)return Promise.resolve();const{from,to}=reportRange();const dep=(state.report&&state.report.deputy_id)||'all';return api('/api/guest-requests-report?from='+encodeURIComponent(from)+'&to='+encodeURIComponent(to)+'&deputy_id='+encodeURIComponent(dep)).then(x=>{state.guestOrdersRows=x.items||[];state.guestOrdersDeputies=x.deputies||[];persist();if(view==='reports')render()}).catch(e=>{state.guestOrdersRows=[];toast(e.message||'خطا در دریافت گزارش سفارش مهمان')})}
function reportForm(){const r=state.report||{from:todayJalali(),to:todayJalali(),type:'attendance'};const from=isoDateFor(r.from),to=isoDateFor(r.to);const rows=state.reportEvents.filter(x=>isoDateFor(x.date)>=from&&isoDateFor(x.date)<=to);return `<section>${heading('گزارش‌گیری','گزارش تردد، فیش، مهمان، سفارش و خطا با بازهٔ شمسی','<button class="btn primary" data-action="export">خروجی CSV</button><button class="btn ghost" data-action="print-report">چاپ گزارش</button>')}<form class="card form-grid" id="report-filter"><label class="field">از تاریخ (شمسی)<input name="from" value="${esc(r.from)}" placeholder="۱۴۰۵/۰۷/۰۱"></label><label class="field">تا تاریخ (شمسی)<input name="to" value="${esc(r.to)}" placeholder="۱۴۰۵/۰۷/۳۰"></label><label class="field">نوع گزارش<select name="type"><option value="attendance" ${r.type==='attendance'?'selected':''}>گزارش تردد و چاپ</option><option value="guest" ${r.type==='guest'?'selected':''}>گزارش کارت مهمان</option><option value="orders" ${r.type==='orders'?'selected':''}>گزارش سفارش غذا</option><option value="errors" ${r.type==='errors'?'selected':''}>گزارش خطا و چاپ مجدد</option><option value="absent" ${r.type==='absent'?'selected':''}>غایبین (سفارش دارند، فیش نگرفتند)</option><option value="guest-orders" ${r.type==='guest-orders'?'selected':''}>سفارش مهمان (درخواست مدیران)</option></select></label>${r.type==='guest-orders'?guestDeputyField(r):''}<div class="form-actions"><button class="btn primary">نمایش گزارش</button></div></form><div class="grid section-gap"><div class="card stat"><span class="label">تعداد رکورد</span><strong>${rows.length}</strong></div><div class="card stat"><span class="label">چاپ‌شده</span><strong>${rows.filter(x=>x.status==='printed').length}</strong></div><div class="card stat"><span class="label">بدون سفارش</span><strong>${rows.filter(x=>x.result==='غذا ندارد').length}</strong></div><div class="card stat"><span class="label">خطا</span><strong>${rows.filter(x=>x.status==='bad'||x.status==='print_error').length}</strong></div></div><div class="card table-wrap section-gap"><table class="table"><thead><tr><th>تاریخ شمسی</th>${isGuestOrders?'<th>معاونت</th><th>سازمان / شرکت</th><th>تعداد</th><th>نوع غذا</th><th>درخواست‌دهنده</th><th>وضعیت</th>':'<th>ساعت</th><th>کد پرسنلی</th><th>نام</th><th>غذا</th><th>نتیجه</th><th>SOURCE_TABLE</th>'}</tr></thead><tbody>${rows.map(e=>isGuestOrders?guestRowHtml(e):`<tr><td>${faDate(e.date)}</td><td>${timeLabel(e.time)}</td><td>${esc(e.pc)}</td><td>${esc(e.name)}</td><td>${esc(e.food||'—')}</td><td>${esc(e.result)}</td><td>${e.deleted===true?'<span class="status ok" title="'+esc(e.deleteNote||'')+'">حذف شد</span>':e.deleted===false?'<span class="status bad" title="'+esc(e.deleteNote||'')+'">در SOURCE_TABLE</span>':'<span class="status warn">نامشخص</span>'}</td></tr>`).join('')||`<tr><td colspan="7" class="empty">رکوردی در بازه انتخاب‌شده وجود ندارد.</td></tr>`}</tbody></table></div></section>`}
  function versionBanner(){const expected=window.__ftPanelExpected||'';if(!expected||expected===PANEL_VERSION)return '';return `<div class="card version-warning"><b>⚠️ فایل پنل شما قدیمی است (نسخهٔ ${esc(PANEL_VERSION)} در مرورگر، نسخهٔ ${esc(expected)} روی سرور).</b><p>مرورگر نسخهٔ کش‌شدهٔ قدیمی <b dir="ltr">food-ticket-web/index.html</b> را نشان می‌دهد؛ به همین دلیل بعضی اصلاحات (حفظ IP، سوئیچ روش چاپ، اعداد کالیبراسیون) دیده نمی‌شود. با <b dir="ltr">Ctrl+F5</b> صفحه را تازه کنید. اگر باز هم همین پیام را دیدید، فایل کامل <b>01-ویرایش‌شده</b> بسته را دوباره روی سرور کپی کنید.</p></div>`}
function settingsForm(){const sections=[['connections','اتصال پایگاه‌ها'],['printer','چاپگر سیستم'],['guests','کارت مهمان'],['ticket-design','طراحی فیش'],['health','سلامت سیستم']].filter(x=>!window.FOOD_TICKET_SECTIONS||window.FOOD_TICKET_SECTIONS[x[0]]!==false);const active=sections.some(x=>x[0]===state.settingsSection)?state.settingsSection:(sections[0]||['connections'])[0];const pages={connections,printer:printerForm,guests:guestCardForm,'ticket-design':ticketDesignForm,health:healthView};let content=versionBanner()+pages[active]();return `<section class="settings-shell"><div class="settings-tabs">${sections.map(([id,label])=>`<button type="button" class="settings-tab ${active===id?'active':''}" data-settings-section="${id}">${label}</button>`).join('')}</div><div class="settings-content">${content}</div></section>`}

function ticketDesignForm(){return window.FoodDesignerUI?window.FoodDesignerUI.html():ticketDesignFormLegacy()}function ticketDesignFormLegacy(){const p=state.printer,items=ensureDesign(),selected=items.find(x=>x.id===state.ticketSelected)||items[0];const buttons=designDefaults.filter(x=>!items.some(y=>y.id===x.id)).map(x=>`<button type="button" data-action="add-design" data-field="${x.id}">＋ ${x.label}</button>`).join('');return `<section>${heading('طراحی فیش غذا (نسخه جدید)','فیلدها را اضافه/حذف/جابه‌جا کنید؛ ذخیره روی سرور برای Worker','<button class="btn primary" data-action="test-print">پیش‌نمایش / چاپ آزمایشی</button><button class="btn ghost" data-action="save-design-server">ذخیره روی سرور</button><button class="btn danger" data-action="reset-design">بازنشانی</button>')}<div class="design-server-bar"><span>قالب متنی چاپ روی Worker اعمال می‌شود. شرکت/عنوان/پاورقی و فیلدهای فعال را ذخیره کنید؛ سپس چاپ آزمایشی بزنید.</span><button type="button" data-action="save-design-server">ذخیره قالب روی سرور</button></div><div class="designer"><div class="design-panel"><div class="card"><h3>تنظیمات قالب</h3><form class="form-grid" id="ticket-design-form"><label class="field">قالب پایه<select name="template"><option ${p.template==='Classic'?'selected':''}>Classic</option><option ${p.template==='ModernLogo'?'selected':''}>ModernLogo</option><option ${p.template==='ElegantLogo'?'selected':''}>ElegantLogo</option><option ${p.template==='Compact'?'selected':''}>Compact</option></select></label><label class="field">کاغذ<select name="paper"><option ${p.paper==='80mm'?'selected':''}>80mm</option><option ${p.paper==='58mm'?'selected':''}>58mm</option></select></label><label class="field full">نام سازمان<input name="company" value="${esc(p.company)}"></label><label class="field full">عنوان فیش<input name="title" value="${esc(p.title)}"></label><label class="field full">پاورقی<input name="footer" value="${esc(p.footer)}"></label><div class="form-actions"><button class="btn primary">ذخی function calendarDays(year,month){if(month<7)return 31;if(month<12)return 30;const a=new Date(jalaliToGregorian(year,12,1)),b=new Date(jalaliToGregorian(year+1,1,1));return Math.round((b-a)/86400000)}

function toFaDigits(value){return String(value).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function openCalendar(input){const value=input.value||todayJalali();const digits=normalizeDigits(value).replace(/\D/g,'');const selected=digits.length===8?digits:[...normalizeDigits(todayJalali()).replace(/\D/g,'')];calendarState={year:Number(selected.slice(0,4)),month:Number(selected.slice(4,6))||1};calendarTarget=input;document.querySelector('.calendar-popup')?.remove();const popup=document.createElement('div');popup.className='calendar-popup';document.body.appendChild(popup);const r=input.getBoundingClientRect();popup.style.right=Math.max(12,window.innerWidth-r.right)+'px';popup.style.top=Math.min(window.innerHeight-330,r.bottom+6)+'px';calendarRender()}
