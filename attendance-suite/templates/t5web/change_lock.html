{% extends 'base.html' %}
{% block title %}تغییر لایسنس{% endblock %}
{% block content %}
<div class="page-head"><div><h1>تغییر لایسنس</h1></div></div>
<div class="card">
  <div id="license-result" class="alert" role="status" hidden></div>
  <form method="post" action="{{ license_check_url }}" id="frmCode" autocomplete="off">
    {% csrf_token %}
    <fieldset class="field">
      <legend>نوع تغییر</legend>
      {% for value, label in change_types %}
        <label class="check-row"><input type="radio" name="ChangeType" value="{{ value }}" required><span>{{ label }}</span></label>
      {% endfor %}
    </fieldset>
    <div class="field">
      <label for="Code">کد</label>
      <input id="Code" name="Code" type="password" maxlength="512" required autocomplete="new-password">
      <small class="help">کد در سامانه ذخیره یا در گزارش‌ها ثبت نمی‌شود.</small>
    </div>
    <button type="submit" class="btn btn-primary">تأیید</button>
  </form>
</div>
<script>
(() => {
  const form = document.getElementById('frmCode');
  const result = document.getElementById('license-result');
  const button = form.querySelector('button[type="submit"]');
  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    result.hidden = true;
    button.disabled = true;
    try {
      const response = await fetch(form.action, {
        method: 'POST',
        body: new FormData(form),
        headers: {'X-Requested-With': 'XMLHttpRequest'},
        credentials: 'same-origin'
      });
      const contentType = response.headers.get('Content-Type') || '';
      if (contentType.includes('application/json')) {
        const payload = await response.json();
        result.textContent = payload.message || 'پاسخی از سرویس دریافت نشد.';
        result.className = `alert ${payload.ok ? 'alert-success' : 'alert-error'}`;
        if (payload.ok) form.querySelector('#Code').value = '';
      } else {
        result.textContent = await response.text();
        result.className = 'alert alert-error';
      }
      result.hidden = false;
    } catch (_) {
      result.textContent = 'نتیجه از سرویس لایسنس دریافت نشد؛ وضعیت نهایی را از سرویس معتبر پیگیری کنید.';
      result.className = 'alert alert-warning';
      result.hidden = false;
    } finally {
      button.disabled = false;
    }
  });
})();
</script>
<style>
.field{margin:14px 0}.field>label,.field>legend{display:block;font-weight:700;margin-bottom:6px}.check-row{display:flex;gap:9px;align-items:center;margin:8px 0}.field input[type=password]{width:100%;max-width:520px;padding:9px;border:1px solid #cbd5e1;border-radius:8px}.help{display:block;margin-top:5px;color:#64748b}
</style>
{% endblock %}
