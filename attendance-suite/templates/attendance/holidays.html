{% extends 'base.html' %}
{% load suite_tags %}
{% block title %}تعطیلات{% endblock %}
{% block content %}
<div class="page-head"><div><h1>تعطیلات رسمی</h1></div></div>
<div class="card">
  <form method="post" class="form-grid">
    {% csrf_token %}
    <div class="field"><label>تاریخ</label><input name="date" placeholder="1404/01/01"></div>
    <div class="field"><label>عنوان</label><input name="title"></div>
    <div class="field"><label>نوع</label><select name="kind">
      <option value="national">رسمی</option><option value="religious">مذهبی</option><option value="org">سازمانی</option>
    </select></div>
    <div class="field"><label>&nbsp;</label><button class="btn btn-primary" type="submit">ثبت</button></div>
  </form>
</div>
<table class="table">
  <thead><tr><th>تاریخ</th><th>عنوان</th><th>نوع</th></tr></thead>
  <tbody>
  {% for r in rows %}
    <tr><td>{{ r.date|jdate }}</td><td>{{ r.title }}</td><td>{{ r.get_kind_display }}</td></tr>
  {% empty %}
    <tr><td colspan="3" class="empty">تعطیلی ثبت نشده.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
