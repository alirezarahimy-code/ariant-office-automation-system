{% extends 'base.html' %}
{% block title %}ورود — سامانه حضور و غیاب{% endblock %}
{% block content %}
<div class="login-wrap">
  <div class="card">
    <div class="card-title">ورود به سامانه</div>
    {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="field"><label>نام کاربری</label><input name="userName" value="{{ username }}" required autofocus autocomplete="username"></div>
      <div class="field" style="margin-top:12px"><label>گذرواژه</label><input name="Password" type="password" required autocomplete="current-password"></div>
      {% if captcha_enabled %}
      <div class="field captcha-field">
        <label for="CaptchaAnswer">عبارت امنیتی</label>
        <div class="captcha-row">
          <img id="login-captcha" src="{% url 'core:captcha_image' %}?n={{ captcha_nonce }}" width="196" height="64" alt="تصویر عبارت امنیتی">
          <button id="refresh-captcha" class="btn btn-ghost" type="button" aria-label="ساخت عبارت امنیتی تازه">تازه‌سازی</button>
        </div>
        <input id="CaptchaAnswer" name="CaptchaAnswer" type="text" required maxlength="6" minlength="6" autocomplete="off" autocapitalize="characters" spellcheck="false">
      </div>
      {% endif %}
      <input type="hidden" name="ReturnURL" value="{{ return_url }}">
      <button class="btn btn-primary" type="submit" style="width:100%;margin-top:16px">ورود</button>
    </form>
  </div>
</div>
{% if captcha_enabled %}
<script>
(() => {
  const image = document.getElementById('login-captcha');
  const answer = document.getElementById('CaptchaAnswer');
  document.getElementById('refresh-captcha').addEventListener('click', () => {
    image.src = `{% url 'core:captcha_image' %}?n=${Date.now()}`;
    answer.value = '';
    answer.focus();
  });
})();
</script>
<style>
.captcha-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.captcha-row img{border:1px solid #cbd5e1;border-radius:8px;image-rendering:auto}
</style>
{% endif %}
{% endblock %}
