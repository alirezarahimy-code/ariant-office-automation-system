name: ساخت و آزمون (CI)

on:
  push:
    branches:
      - main
      - 'arena/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-test:
    name: ساخت و اجرای آزمون‌ها
    runs-on: ubuntu-latest

    steps:
      - name: دریافت کد
        uses: actions/checkout@v4

      - name: نصب دات‌نت
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # خروجی همه گام‌ها در build.log ذخیره می‌شود تا در صورت خطا،
      # متن خطا به‌صورت کامنت در Pull Request قرار بگیرد.
      - name: بازیابی پکیج‌ها
        shell: bash
        run: |
          set -o pipefail
          dotnet restore Ariant.OfficeAutomation.sln 2>&1 | tee -a build.log

      - name: ساخت راه‌حل
        shell: bash
        run: |
          set -o pipefail
          dotnet build Ariant.OfficeAutomation.sln --configuration Release --no-restore 2>&1 | tee -a build.log

      - name: اجرای آزمون‌ها
        shell: bash
        run: |
          set -o pipefail
          dotnet test Ariant.OfficeAutomation.sln --configuration Release --no-build --verbosity normal 2>&1 | tee -a build.log

      - name: انتشار خروجی اجرایی
        if: github.ref == 'refs/heads/main'
        run: dotnet publish src/Ariant.OfficeAutomation.Web/Ariant.OfficeAutomation.Web.csproj --configuration Release --no-build --output ./publish

      - name: بارگذاری آرتیفکت
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ariant-office-automation-web
          path: ./publish
          if-no-files-found: ignore

      - name: گزارش خطا در Pull Request
        if: failure() && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "### نتیجه CI: ناموفق"
            echo
            echo "#### خطوط کلیدی خطا"
            echo
            echo '```text'
            grep -aE "error [A-Z]+[0-9]+|\[FAIL\]|Error Message|Assert\.|Expected:|Actual:|Total tests:|Passed:|Failed:|Build FAILED" build.log 2>/dev/null | head -n 60 || echo "خطای مشخصی در گزارش یافت نشد."
            echo '```'
            echo
            echo "<details><summary>خروجی کامل (انتهای گزارش ساخت)</summary>"
            echo
            echo '```text'
            tail -c 4000 build.log 2>/dev/null || echo "فایل گزارش موجود نیست."
            echo '```'
            echo
            echo "</details>"
          } > ci-comment.md

          gh pr comment "${{ github.event.pull_request.number }}" --body-file ci-comment.md
